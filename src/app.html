<!doctype html>
<html lang="id" class="scroll-smooth">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/icon.svg" />
		<link rel="icon" type="image/png" sizes="32x32" href="%sveltekit.assets%/icon-32.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
		<meta name="theme-color" content="#047857" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.json" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/ios/180.png" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="apple-mobile-web-app-title" content="Moslem" />
		<script>
			// Cegah pinch-zoom di iOS (standalone PWA) supaya terasa native
			document.addEventListener('gesturestart', (e) => e.preventDefault());
			// Pasang tema sebelum render supaya tidak kedip (flash) saat load
			try {
				const t = localStorage.getItem('moslem:theme');
				if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) {
					document.documentElement.classList.add('dark');
				}
			} catch {}
		</script>
		%sveltekit.head%
	</head>
	<body
		data-sveltekit-preload-data="hover"
		class="bg-slate-50 text-slate-900 antialiased dark:bg-slate-950 dark:text-slate-100"
		style="-webkit-tap-highlight-color: transparent"
	>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
